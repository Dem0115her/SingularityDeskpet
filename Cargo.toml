[package]
name = "singularity"
version = "1.5.0"
edition = "2021"
description = "Singularity - a physically inspired black hole desktop pet"
license = "MIT"
publish = false

[build-dependencies]
winres = "0.1"

[dependencies]
bytemuck = { version = "1.16", features = ["derive"] }
egui = { version = "0.28.1", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "0.28.1", default-features = false }
png = "0.17"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "0.20.1"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

